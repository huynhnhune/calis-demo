<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Calis Lê Văn Tám</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column — sticky header, scrolling view, fixed bottom tab bar. Palette: chalk + park iron, flame for streaks. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --surface-2:#E2E7E0; --line:#D0D8CF;
  --fg:#15201B; --muted:#58665F;
  --accent:#1D6A4F; --accent-soft:#D5E8DD; --on-accent:#FFFFFF;
  --flame:#A84412;--bronze:#A8662C;--on-flame:#FFFFFF; --flame-soft:#FAE2D5;
  --good:#176A40; --good-soft:#D9EEDF; --warn:#7E5609; --warn-soft:#F5E8C8; --danger:#A02C22;
  --font-display:"Montserrat","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#161D19; --surface-2:#1F2823; --line:#2B3630;
  --fg:#E5EBE7; --muted:#97A59D;
  --accent:#5BC598; --accent-soft:#1C3A2D; --on-accent:#07140E;
  --flame:#FF8A50;--bronze:#E3A46E;--on-flame:#1F0E05; --flame-soft:#3B2318;
  --good:#5BC598; --good-soft:#1C3A2D; --warn:#E3B04B; --warn-soft:#3A2F14; --danger:#F07468;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#161D19; --surface-2:#1F2823; --line:#2B3630;
  --fg:#E5EBE7; --muted:#97A59D;
  --accent:#5BC598; --accent-soft:#1C3A2D; --on-accent:#07140E;
  --flame:#FF8A50;--bronze:#E3A46E;--on-flame:#1F0E05; --flame-soft:#3B2318;
  --good:#5BC598; --good-soft:#1C3A2D; --warn:#E3B04B; --warn-soft:#3A2F14; --danger:#F07468;
  color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.app,.nav-in{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--font-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.brand span{font-size:.72rem;color:var(--muted)}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.who label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.who select{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;font-weight:600;max-width:170px}

.app{padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list>.item:first-child{border-top:0}

.av{--h:150;display:inline-grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;background:hsl(var(--h) 42% 32%);color:#fff;font-weight:700;font-size:.78rem;letter-spacing:.02em}
.av.sm{width:26px;height:26px;font-size:.65rem}
.av.lg{width:56px;height:56px;font-size:1.1rem}
.stack{display:flex}.stack .av{margin-left:-6px;border:2px solid var(--surface)}.stack .av:first-child{margin-left:0}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.flame{background:var(--flame-soft);color:var(--flame)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.lvl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.flame{background:var(--flame);border-color:var(--flame);color:var(--on-flame)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.danger{color:var(--danger)}

.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* streak */
.streak{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.flame-n{display:flex;flex-direction:column;align-items:center;justify-content:center;width:86px;height:86px;border-radius:20px;background:var(--flame-soft);color:var(--flame)}
.flame-n .num{font-size:2.6rem;font-weight:700;line-height:.9}
.flame-n span{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.dots{display:flex;gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;color:var(--muted)}
.dot i{width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:block}
.dot i.on{background:var(--flame)}
.dot i.rest{background:var(--line)}
.dot i.today{outline:2px dashed var(--flame);outline-offset:1px}

/* workout */
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ex:first-child{border-top:0}
.ex input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.ex .dose{font-family:var(--font-display);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex.done .name{text-decoration:line-through;color:var(--muted)}
.note{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.85rem}
.banner{display:flex;gap:10px;align-items:center;background:var(--flame-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.banner b{color:var(--flame)}

.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.stat .num{font-size:1.35rem;font-weight:700;line-height:1.1}
.stat small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* leaderboard */
.lb .item{gap:10px}
.rank{width:26px;text-align:center;font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--muted)}
.rank.r1{color:#B07D0A}.rank.r2{color:#7D878E}.rank.r3{color:var(--bronze)}
.lb .me{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.mv{font-size:.7rem;font-weight:700}.mv.up{color:var(--good)}.mv.dn{color:var(--danger)}

/* feed */
.post .txt{font-size:.93rem}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.85rem;cursor:pointer}
.react[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cm{font-size:.86rem;background:var(--surface-2);border-radius:10px;padding:6px 10px}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.74rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 6px;font-size:.85rem;cursor:pointer}
.err{color:var(--danger);font-size:.85rem}
.drow{display:grid;grid-template-columns:1fr 58px 64px 30px;gap:6px;align-items:center}
.drow .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem}

/* session */
.when{display:flex;align-items:baseline;gap:8px}
.when .num{font-size:2rem;font-weight:700;line-height:1}
.place{display:flex;gap:6px;align-items:center;font-size:.88rem}

/* metrics */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.metric .num{font-size:1.6rem;font-weight:700;line-height:1}
.metric .lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.spark{color:var(--accent);width:100%;height:34px;display:block}
.delta{font-size:.78rem;font-weight:600}
.delta.good{color:var(--good)}.delta.bad{color:var(--danger)}.delta.flat{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.75rem;color:var(--muted)}
.badge b{display:block;font-family:var(--font-display);font-size:1.05rem;text-transform:uppercase;color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.badge.on b{color:var(--accent)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:600;min-width:0}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a{position:relative}
.nav-dot{position:absolute;top:6px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--flame);border:2px solid var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center;transition:opacity .2s}
.proto{font-size:.75rem;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

/* profile dashboard */
.lab{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.acc-t{color:var(--accent);font-weight:600}
.score{gap:6px}
.score-n{font-size:3.6rem;font-weight:700;line-height:.95;color:var(--accent)}
.score .delta{font-size:.9rem}
.hlgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hl .lab{text-transform:none;letter-spacing:0;font-size:.8rem}
.hl-v{display:flex;align-items:baseline;gap:4px}
.hl .big{font-size:2.1rem;font-weight:700;line-height:1}
.hl .unit{font-size:.82rem;color:var(--muted)}
.hl-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto}
.hl-foot .spark{width:62px;flex:none}
.skill{gap:8px;padding-block:12px}
.skill-n{font-family:var(--font-display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.steps i{height:8px;border-radius:999px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.pr-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);flex:none}
.pr-v{font-size:1.25rem;font-weight:700;color:var(--accent);white-space:nowrap}
details.card summary{cursor:pointer;list-style-position:inside}

/* photos */
.cover{padding:0;overflow:hidden;gap:0}
.cover-art{display:block;width:100%;max-width:100%;aspect-ratio:16/9;height:auto;color:var(--accent)}
.cover-btn{display:block;border:0;padding:0;width:100%;background:var(--surface-2);cursor:zoom-in}
.cover-img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover}
.cover-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip .thumb{flex:none;width:104px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumb{border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;background:var(--surface-2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.post-img{border:0;padding:0;border-radius:12px;overflow:hidden;cursor:zoom-in;display:block;width:100%;background:var(--surface-2)}
.post-img img{display:block;width:100%;max-height:420px;object-fit:cover}
.preview{display:block;border-radius:12px;max-height:320px;object-fit:cover;width:100%}
.empty-al{cursor:pointer;border-style:dashed;text-align:center;align-items:center;gap:4px}
img.av{object-fit:cover;padding:0}
.avedit{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:.7rem;color:var(--accent);font-weight:600;flex:none}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(5,8,6,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:72vh;border-radius:12px;object-fit:contain}
.lightbox .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}

/* streak card */
.streak-card{gap:14px}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-flame{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--surface-2);color:var(--muted);flex:none;transition:background .3s,color .3s}
.sc-flame svg{width:32px;height:32px}
.streak-card.lit .sc-flame{background:var(--flame-soft);color:var(--flame)}
.sc-n{display:flex;align-items:baseline;gap:8px}
.sc-n .num{font-size:2.7rem;font-weight:700;line-height:.9;color:var(--flame)}
.sc-u{font-weight:600}
.sc-s{color:var(--flame);font-weight:600;margin-top:2px}
.streak-card.lit .sc-s,.streak-card.resting .sc-s{color:var(--muted);font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wk-l{font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.wk-c{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-family:var(--font-display);font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.wk-c svg{width:18px;height:18px}
.wk.done .wk-c{background:var(--flame);color:var(--surface)}
.wk.rest .wk-c{background:transparent;border:2px dashed var(--line)}
.wk.now .wk-c{background:transparent;border:2px dashed var(--flame);color:var(--flame)}
.wk.today .wk-l{color:var(--flame)}
.sc-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sc-m{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-weight:600}
.sc-bar{height:6px}
.sc-bar i{background:var(--flame)}
.sc-foot .pill svg{width:13px;height:13px}
.sc-toggle{align-self:center}
.cal{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h b{font-family:var(--font-display);font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.cal-h .btn{font-size:1.3rem;line-height:1}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;justify-items:center}
.cw{font-size:.64rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cd{display:grid;place-items:center;width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;font-family:var(--font-display);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted);font-style:normal}
.cd.done{background:var(--flame);color:var(--surface)}
.cd.rest{background:transparent;border:2px dashed var(--line)}
.cd.miss{background:transparent;border:1px solid var(--line);color:var(--muted);opacity:.7}
.cd.future{background:transparent;color:var(--line)}
.cd.now{background:transparent;border:2px dashed var(--flame);color:var(--flame)}
.cd.today.done{outline:2px solid var(--flame);outline-offset:2px}
.cal-legend{display:flex;justify-content:center;gap:14px;font-size:.72rem;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend .cd{width:12px;height:12px;border-radius:4px;aspect-ratio:auto}
.cal-s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;font-size:.7rem;color:var(--muted)}
.cal-s span{background:var(--surface-2);border-radius:10px;padding:6px 4px}
.cal-s b{display:block;font-family:var(--font-display);font-size:1.35rem;color:var(--fg);line-height:1.1}
.goal-set{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--flame)}
.chip[aria-pressed="true"]{background:var(--flame);border-color:var(--flame);color:var(--surface)}
/* rest plans */
.pp{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pp i{font-style:normal;font-size:.6rem;font-weight:700;min-width:24px;text-align:center;padding:2px 3px;border-radius:5px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.pp i.r{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.plan-sel{display:flex;flex-direction:column;gap:4px;width:136px;flex:none}
.plan-sel select{padding:5px 8px;font-size:.82rem}
/* weekly plan picker */
.plan-edit{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.plan-edit:first-child{border-top:0;padding-top:4px}
.seg-sm button{padding:5px 8px;font-size:.8rem}
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dp{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 0;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;font-family:inherit}
.dp:hover{border-color:var(--accent)}
.dp[aria-pressed="true"]{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent)}
.list>.item.mem-plan{flex-direction:column;align-items:stretch;gap:8px}
.roster{display:flex;flex-direction:column;gap:6px}
.who-pill{padding:2px 10px 2px 2px;gap:6px;font-size:.8rem}
.who-pill .av{width:22px;height:22px;font-size:.55rem}
.who-pill:not(.good){background:transparent;border:1px dashed var(--line)}
.rest-warn{background:var(--warn-soft);color:var(--fg)}
/* multi-day assign */
.dategrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dc{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;cursor:pointer;color:var(--fg);font-family:inherit;min-width:0}
.dc small{font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.dc b{font-family:var(--font-display);font-size:1.1rem;line-height:1.1}
.dc i{font-style:normal;font-size:.55rem;color:var(--muted);min-height:.9em}
.dc:hover:not(:disabled){border-color:var(--accent)}
.dc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dc[aria-pressed="true"] small,.dc[aria-pressed="true"] i{color:var(--on-accent)}
.dc.rest{border-style:dashed;background:transparent;opacity:.55;cursor:not-allowed}
.pgrid{display:grid;grid-template-columns:72px repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.pg-h{text-align:center;font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;line-height:1.25}
.pg-l{font-size:.78rem;font-weight:600}
.pg{aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;padding:0}
.pg.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pg.miss{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pg.rest{background:transparent;border-style:dashed;cursor:default}
a.pill{text-decoration:none}
a.pill:hover{color:var(--accent)}
.warn-t{color:var(--warn);font-weight:600}
.wk.up .wk-c{background:transparent;border:2px solid var(--line);color:var(--fg)}
.wk-x{font-size:.55rem;font-weight:700;color:var(--flame);text-transform:uppercase;letter-spacing:.04em;margin-top:-3px}
.week-card .sec-h h3{font-size:1.2rem}
.hist{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.hist-d{display:flex;flex-direction:column;align-items:center;width:38px;flex:none;line-height:1}
.hist-d b{font-size:1.4rem}
.hist-d small{font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ex .name small.sub{display:block;font-size:.76rem;color:var(--muted);text-decoration:none;font-weight:400;margin-top:1px}
.combo-code{font-family:var(--font-display);font-weight:700;font-size:1.15rem;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 10px;flex:none}
.combo-form{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:1fr 70px 30px;gap:6px;align-items:center}
.crow .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem}
.sec-lab{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);padding-top:10px}
.sec-lab+.ex{border-top:0}
.lesson{gap:12px}
.ls-sec{display:flex;flex-direction:column;gap:3px}
.ls-sec .lab{color:var(--accent)}
.ls-it{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:3px 0;border-bottom:1px dashed var(--line)}
.ls-it:last-child{border-bottom:0}
.ls-it b{font-size:1.05rem;white-space:nowrap}
.lrow{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.lrow-n{grid-column:1/-1;display:flex;gap:6px;align-items:center}
.lrow-n input{width:76px}
.lrow-n .x{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem}
.save-ls input{flex:1;min-width:0}
.ex-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:8px;border-top:1px solid var(--line)}
.ex-wrap .ex{border-top:0}
.sec-lab+.ex-wrap,div>.ex-wrap:first-child{border-top:0}
.ex-wrap>.skip-note,.ex-wrap>.skip-ed{grid-column:1/-1}
.skip-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit}
.skip-btn:hover{border-color:var(--warn);color:var(--warn)}
.ex-wrap.skipped .name{text-decoration:line-through;color:var(--muted)}
.ex-wrap.skipped .dose{color:var(--muted)}
.skip-note{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 8px 34px;font-size:.8rem;color:var(--warn);font-weight:600}
.skip-ed{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:10px;margin-bottom:10px}
.skip-ed .chip{font-size:.78rem}
.skip-list{display:flex;flex-direction:column;gap:2px;margin-top:4px;padding:6px 8px;border-radius:8px;background:var(--warn-soft)}
.cancelled{opacity:.8;border-style:dashed}
.cancelled h3{text-decoration:line-through;color:var(--muted)}
.cancel-ed{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:10px}
.invite{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.invite-code{font-size:2rem;font-weight:700;letter-spacing:.12em;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:4px 14px;user-select:all}
.mini-row{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;color:var(--fg);font:inherit;text-align:left}
.mini-row:hover{border-color:var(--flame)}
.mr-flame{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--surface-2);color:var(--muted);flex:none}
.mr-flame svg{width:20px;height:20px}
.mini-row.lit .mr-flame{background:var(--flame-soft);color:var(--flame)}
.mr-week{display:grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border-radius:10px;background:var(--flame-soft);color:var(--flame);font-family:var(--font-display);font-weight:700;flex:none}
button.crew-i{background:transparent;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;position:relative}
button.crew-i:disabled{cursor:default}
.poke-b{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--flame);margin-top:-2px}
button.crew-i:disabled .poke-b{color:var(--muted)}
button.crew-i:not(:disabled):hover .ring{border-color:var(--flame)}
button.pg-h{background:transparent;border:0;border-radius:6px;padding:2px 0;cursor:pointer;font-family:inherit}
button.pg-h.sel{background:var(--accent-soft);color:var(--accent)}
.day-rest{font-size:.84rem;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.sess-row{flex-direction:row;align-items:center;gap:10px;padding-block:10px}
.sr-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:transparent;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.sr-main .grow{display:flex;flex-direction:column;min-width:0}
.sr-d{display:flex;flex-direction:column;align-items:center;width:38px;flex:none;line-height:1}
.sr-d b{font-size:1.5rem}
.sr-d small{font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin-top:2px}
.sess-row.is-cx b{text-decoration:line-through;color:var(--muted)}
/* calendar home */
.cal-card{gap:8px;padding-bottom:10px}
.cal-top{display:flex;align-items:center;justify-content:space-between}
.cal-top b{font-family:var(--font-display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
.cal-top .btn{font-size:1.3rem;line-height:1}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--fg);font-family:inherit;min-width:0}
.cal-d small{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-d b{font-family:var(--font-display);font-size:1.35rem;line-height:1}
.cal-d.past b{color:var(--muted)}
.cal-d.today{border-color:var(--line)}
.cal-d.today small{color:var(--flame)}
.cal-d.sel{background:var(--accent);border-color:var(--accent)}
.cal-d.sel b,.cal-d.sel small{color:var(--on-accent)}
.mks{display:flex;gap:3px;height:7px;align-items:center}
.mk{display:inline-block;width:7px;height:7px;border-radius:50%;font-style:normal}
.mk.park{background:var(--good)}
.mk.park.cx{background:transparent;border:1.5px solid var(--muted)}
.mk.mine{background:var(--flame)}
.mk.done{background:var(--flame);box-shadow:0 0 0 2px var(--flame-soft)}
.cal-d.sel .mk.park{background:var(--on-accent)}
.cal-legend2{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:.7rem;color:var(--muted)}
.cal-legend2 span{display:flex;align-items:center;gap:5px}
.hero{gap:12px}
.hero.is-park{border-color:var(--good);border-width:1.5px}
.hero-top{display:flex;gap:12px;align-items:flex-start}
.hp-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--good-soft);color:var(--good);flex:none}
.hp-ic svg{width:26px;height:26px}
.hero-top.none .hp-ic{background:var(--surface-2);color:var(--muted)}
.hero-top.cx .hp-ic{background:var(--warn-soft);color:var(--warn)}
.hero-top.cx .hp-t{text-decoration:line-through;color:var(--muted)}
.hp-t{display:block;font-family:var(--font-display);font-size:1.35rem;line-height:1.15;margin-top:1px}
.hero-top a{color:var(--accent)}
.goers{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.ask{font-size:1rem}
.confirm-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.confirm-btns .btn{padding-block:11px}
.my-state{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:10px 12px;background:var(--accent-soft);font-size:.92rem}
.my-state.rest{background:var(--surface-2)}
.my-state.done{background:var(--good-soft);color:var(--good);font-weight:700}
.disclose{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0 0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer}
.park-note{border-left:3px solid var(--good)}
.who-g{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.ring.todo2{border-color:var(--line)}
.str-list{display:flex;flex-direction:column;gap:8px}
.str-row{display:flex;align-items:center;gap:10px}
.str-n{width:44px;font-weight:600;font-size:.88rem}
.str-v{width:42px;text-align:right;font-weight:700}
.ch-mini{width:100%;background:transparent;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.confirm-btns{grid-template-columns:1fr 1fr}
.confirm-btns .btn[data-v="park"]{grid-column:1/-1}
.asg-item{flex-wrap:wrap;row-gap:6px}
.asg-item>.grow{flex:1 1 100%}
.asg-item>.btn{margin-left:auto}
@media (max-width:380px){
  .brand span,.who label{display:none}
  .brand b{font-size:1.1rem}
  .who select{max-width:150px}
  h2{font-size:1.35rem}
}
/* commit challenge */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rules>div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.rules p{font-size:.88rem}
.commit-bar{position:relative;padding:4px 0}
.commit-bar .bar{height:10px}
.cb-mark{position:absolute;top:0;width:3px;height:18px;border-radius:2px;background:var(--fg);transform:translateX(-1px)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba-i{display:flex;flex-direction:column;gap:4px;min-width:0}
.ba-ph{aspect-ratio:3/4;max-width:100%;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;border:1px dashed var(--line)}
.ba-ph img{width:100%;height:100%;object-fit:cover}
.ph-sample{font-size:.74rem;color:var(--muted);text-align:center;padding:6px}
.ba-mini{display:flex;gap:4px;flex:none}
.ba-mini>*{width:30px;height:40px;border-radius:6px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:.55rem;padding:0;overflow:hidden}
.join-card{border-color:var(--accent);border-width:1.5px}
/* type scale for Montserrat (wider than the old condensed face) */
h1,h2,h3{font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;text-transform:none}
h3{font-size:.92rem;letter-spacing:.02em}
.num{letter-spacing:-.02em}
.brand b{font-size:1.02rem;letter-spacing:.01em;font-weight:800}
.dose{font-size:1rem;font-weight:700}
.hl .big{font-size:1.75rem}
.score-n{font-size:3rem}
.sc-n .num{font-size:2.3rem}
.cal-d b{font-size:1.1rem;font-weight:700}
.cal-top b,.cal-h b{font-size:.92rem}
.hp-t{font-size:1.1rem;font-weight:800}
.when .num{font-size:1.6rem}
.skill-n{font-size:.95rem}
.pr-v{font-size:1rem}
.combo-code{font-size:.95rem}
.invite-code{font-size:1.5rem}
.rank{font-size:1.05rem}
.stat .num{font-size:1.1rem}
.wk-c{font-size:.82rem}
.cd{font-size:.8rem}
.sr-d b,.hist-d b{font-size:1.15rem}
.streak-mini .num,.flame-n .num{font-size:1.9rem}
/* weekly ring */
.ring-link{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);flex:none}
.wring{width:46px;height:46px;flex:none}
.wr-track{fill:none;stroke:var(--surface-2);stroke-width:6}
.wr-val{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.wring.full .wr-val{stroke:var(--good)}
.wr-txt{display:flex;flex-direction:column;line-height:1.15}
.wr-txt b{font-family:var(--font-display);font-size:1.05rem;font-weight:800}
.wr-txt small{font-size:.66rem;color:var(--muted)}
.wr-txt .wr-streak{color:var(--flame);display:flex;align-items:center;gap:2px;font-weight:700}
/* bento */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;text-align:left;font:inherit;color:var(--fg);text-decoration:none}
button.tile,a.tile{cursor:pointer}
button.tile:hover,a.tile:hover{border-color:var(--accent)}
.tile .spark,.tile .steps{width:100%}
.t-wide{grid-column:1/-1}
.t-habit{background:var(--flame-soft);border-color:transparent}
.t-habit:hover{border-color:var(--flame)!important}
.t-big{font-family:var(--font-display);font-weight:800;font-size:2.5rem;line-height:1;color:var(--flame);font-variant-numeric:tabular-nums}
.t-big small{font-size:.95rem;font-weight:700;margin-left:6px}
.t-mid{font-family:var(--font-display);font-weight:800;font-size:1.15rem;line-height:1.2}
.t-more{font-size:.78rem;font-weight:700;color:var(--flame);margin-top:2px}
.t-clip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bstrip{display:flex;gap:5px;margin-top:4px}
.bs{display:block;width:24px;height:8px;border-radius:4px;background:var(--surface)}
.bs.done{background:var(--flame)}
.bs.rest{background:transparent;border:1px dashed var(--flame)}
.bs.today{outline:2px solid var(--flame);outline-offset:1px}
.minibars{display:flex;gap:8px;align-items:flex-end;height:48px;width:100%;margin-top:4px}
.minibars span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;flex:1;height:100%}
.minibars i{display:block;width:100%;max-width:20px;background:var(--accent);border-radius:4px 4px 2px 2px}
.minibars small{font-size:.62rem;color:var(--muted)}
/* celebration */
.celebrate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(5,8,6,.55);overflow:hidden;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cel-card{position:relative;z-index:2;background:var(--surface);color:var(--fg);border-radius:20px;padding:22px 20px;max-width:320px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:cel-pop .35s ease-out}
.cel-card b{font-family:var(--font-display);font-size:1.3rem;font-weight:800}
.cel-flame{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--flame-soft);color:var(--flame);animation:cel-burst 1.1s ease-out}
.cel-flame svg{width:50px;height:50px}
.confetti{position:absolute;top:-14px;left:var(--x);width:8px;height:14px;background:var(--c);border-radius:2px;z-index:1;animation:cel-fall var(--t) linear var(--d) forwards}
@keyframes cel-fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes cel-pop{from{transform:scale(.85)}to{transform:none}}
@keyframes cel-burst{0%{transform:scale(.75)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.cel-card,.cel-flame{animation:none}}
.mem-open{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:0;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.mem-open:hover b{color:var(--accent)}
.mem-open .chev{font-size:1.1rem}
.hero-line{display:flex;align-items:center;gap:12px}
.hero-line .grow{display:flex;flex-direction:column;min-width:0}
.hp-ic.sm{width:38px;height:38px;border-radius:12px}
.hp-ic.sm svg{width:22px;height:22px}
.hero-line.none .hp-ic{background:var(--surface-2);color:var(--muted)}
.hero-line.cx .hp-ic{background:var(--warn-soft);color:var(--warn)}
.hero-line.cx .hp-t{text-decoration:line-through;color:var(--muted)}
.hero-line .hp-t{font-size:1.05rem}
.av.more{background:var(--surface-2);color:var(--muted)}
.hero-more{display:flex;flex-direction:column;gap:10px}
.hero-more a{color:var(--accent);font-weight:600}
.crew-card{gap:10px}
.crew-head{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;padding:0;font:inherit;color:var(--fg);text-align:left;cursor:pointer}
.crew-head .grow{display:flex;flex-direction:column}
.mini-note summary{cursor:pointer;font-size:.84rem;font-weight:600;color:var(--accent)}

const cStatus=c=>c.start>TODAY?'soon':c.end<TODAY?'done':'live';
// Commitment challenge: count trained days in the period against the minimum (e.g. 75% of days).
function commitInfo(c,id){const p=c.progress[id]||{},days=(p.days||[]).filter(d=>d>=c.start&&d<=c.end),total=between(c.start,c.end)+1;
  let elapsed=TODAY<c.start?0:between(c.start,TODAY<c.end?TODAY:c.end)+1;if(TODAY>=c.start&&TODAY<=c.end&&!days.includes(TODAY))elapsed--;
  let left=0;if(TODAY<c.start)left=total;else if(TODAY<=c.end)left=between(TODAY,c.end)+1-(days.includes(TODAY)?1:0);
  const need=Math.ceil(c.minRate*total);
  return{done:days.length,total,need,left,rate:elapsed>0?days.length/elapsed:1,possible:days.length+left>=need,pass:days.length>=need}}
function score(c,id){const p=c.progress[id]||{v:0,b:0};
  if(c.type==='commit'){const ci=commitInfo(c,id);return{abs:ci.done,pct:Math.min(1,ci.rate)}}
  if(c.type==='total')return{abs:p.v,pct:c.target?p.v/c.target:0};
  if(c.type==='progress')return{abs:p.v,pct:p.b?(p.v-p.b)/p.b:0};
  const days=Math.max(1,between(c.start,TODAY<c.end?TODAY:c.end)+1);return{abs:p.v,pct:Math.min(1,p.v/days)}}
const defMode=c=>c.type==='progress'||c.type==='commit'?'pct':'abs';
function ranking(c,mode){mode=mode||defMode(c);return c.participants.map(id=>({id,...score(c,id)})).sort((a,b)=>b[mode]-a[mode]||a.id.localeCompare(b.id))}

function hash01(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return((h>>>0)%1000)/1000}
// Sample history derived from the current streak; the real app reads the daily_logs table.
function dayState(m,ds){
  const i=between(ds,TODAY);if(i<0)return'future';
  const d=day(m.id),before=d.status==='done'?m.streak-1:m.streak;
  if(i===0){const st=statusOf(m);return st==='done'?'done':st?'rest':'now'}
  if(isPlanRest(m,ds))return'rest';
  if(i<=before)return'done';
  if(i===before+1)return'miss';
  return hash01(m.id+ds)<.85?'done':'miss';
}
function monthCal(m){

  for(let k=0;k<lead;k++)cells+='<span></span>';
  for(let dd=1;dd<=n;dd++){const ds=iso(new Date(y,mo,dd)),st=dayState(m,ds);

  else if(myMode)confirm=`<div class="my-state ${myMode}"><span>Bạn: <b>${MODE_LABEL[myMode]}</b>${myMode==='park'&&isT&&se&&se.checkins.includes(m.id)?' · đã check-in':''}</span><button class="btn ghost sm" data-act="clearmode">Đổi</button></div>
      ${myMode==='park'&&isT&&park&&!se.checkins.includes(m.id)?`<button class="btn flame block" data-act="checkin" data-id="${se.id}">Check-in khi đến công viên</button>`:''}`;
  else confirm=`<p class="ask"><b>${isT?'Hôm nay':fmtD(ds)} bạn tập thế nào?</b></p>
    <div class="confirm-btns">${park?'<button class="btn pri" data-act="setmode" data-v="park">Tập ở công viên</button>':''}<button class="btn ${park?'':'pri'}" data-act="setmode" data-v="self">Tự tập</button><button class="btn" data-act="setmode" data-v="rest">Nghỉ</button></div>`;
  // ---- secondary 1: session content
  const active=myMode==='park'||myMode==='self'||done;
  const open=ui.showContent===ds;
  const a=assignmentFor(m.id,ds);
  const content=isT&&active?todayWork():'';
  const hasDetails=park||!(isT&&active);
  const details=open?`<div class="hero-more">
      ${park?`<div><span class="lab">${past?'Đã tham gia':'Ai sẽ tập'} · ${going.length}</span><p class="small">${going.length?going.map(x=>x.id===m.id?'Bạn':esc(x.name)).join(', '):'Chưa có ai'}</p></div>
      ${se.place&&se.place!=='Công viên Lê Văn Tám'?`<div><span class="lab">Địa điểm</span><p class="small">${esc(se.place)}</p></div>`:''}
      ${se.plan?`<div><span class="lab">Kế hoạch buổi chung</span><p class="small">${esc(se.plan)}</p></div>`:''}`:''}
      ${past?(()=>{const l=logOf(m.id,ds);return`<div><span class="lab">Bạn đã tập</span>${l?logHTML(l):'<p class="small muted">Không có ghi nhận buổi tập.</p>'}</div>`})()
        :!(isT&&active)?`<div><span class="lab">Bài tập${a?' · '+a.items.length+' bài':''}</span>${a?lessonSections(a.items):'<p class="small muted">Chưa có bài cho ngày này.</p>'}</div>`:''}
    </div>`:'';
  // ---- who trains on this day
  const G={park:[],self:[],rest:[],none:[]};
  S.members.forEach(x=>{const md=modeOf(x.id,ds);G[md||(isPlanRest(x,ds)?'rest':'none')].push(x)});
  const isDone=x=>((S.daily[ds]||{})[x.id]||{}).status==='done';
  const ppl=list=>list.map(x=>`<div class="crew-i" title="${esc(x.name)}${isDone(x)?': đã tập xong':''}"><span class="ring ${isDone(x)?'done':'todo2'}">${av(x)}</span><span class="crew-n">${x.id===m.id?'Bạn':esc(x.name)}</span></div>`).join('');
  const pokeList=G.none.map(x=>{if(x.id===m.id||!isT)return`<div class="crew-i"><span class="ring todo">${av(x)}</span><span class="crew-n">${x.id===m.id?'Bạn':esc(x.name)}</span></div>`;
    const poked=(S.pokes[TODAY]||{})[m.id+'>'+x.id];
    return`<button class="crew-i poke" data-act="poke" data-id="${x.id}" ${poked?'disabled':''} title="${poked?'Đã nhắc':'Nhắc'} ${esc(x.name)}"><span class="ring todo">${av(x)}</span><span class="crew-n">${esc(x.name)}</span><span class="poke-b">${poked?'Đã nhắc':'Nhắc'}</span></button>`}).join('');
  const grp=(k,lab,html)=>G[k].length?`<div class="who-g"><span class="lab">${lab} · ${G[k].length}</span><div class="crew">${html}</div></div>`:'';
  return`
  <div class="row"><div class="grow"><p class="small muted">${WDL[T0.getDay()]}, ${fmtS(TODAY)}</p><h2>Chào ${esc(m.name)}</h2></div>
    ${(()=>{const R=19,C=2*Math.PI*R,pr=Math.min(1,wd/Math.max(1,wp));
      return`<a class="ring-link" href="#me" title="Xem tiến độ trong tab Tôi"><svg class="wring ${wd>=wp?'full':''}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="${R}" class="wr-track"/><circle cx="24" cy="24" r="${R}" class="wr-val" stroke-dasharray="${(C*pr).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 24 24)"/></svg>
        <span class="wr-txt"><b>${wd}/${wp}</b><small>buổi tuần này</small>${isDaily(m)?`<small class="wr-streak">${FLAME_S} ${m.streak} ngày</small>`:''}</span></a>`})()}</div>
  ${isT&&pokers.length&&!statusOf(m)&&!myMode?`<div class="banner">${av(pokers[0],'sm')}<span><b>${esc(pokers.map(x=>x.name).join(', '))}</b> nhắc bạn xác nhận buổi tập hôm nay</span></div>`:''}
  ${calWeek(m,ds)}
  <div class="card hero ${park?'is-park':''}">
    ${head}
    ${confirm}
    ${hasDetails?`<button class="disclose" data-act="showcontent" aria-expanded="${open}"><span>${open?'Thu gọn':'Chi tiết'}</span><span class="chev">${open?'−':'›'}</span></button>
    ${details}`:''}
  </div>
  ${content}
  <div class="card crew-card">
    <button class="crew-head" data-act="crewopen" aria-expanded="${!!ui.crewOpen}"><div class="grow"><b>${isT?'Cả nhóm hôm nay':'Cả nhóm · '+fmtD(ds)}</b>
      <span class="small muted">${[G.park.length?G.park.length+' công viên':'',G.self.length?G.self.length+' tự tập':'',G.none.length?G.none.length+' chưa xác nhận':''].filter(Boolean).join(' · ')||'Chưa ai xác nhận'}</span></div><span class="chev">${ui.crewOpen?'−':'›'}</span></button>
    ${ui.crewOpen?`${grp('park','Ở công viên',ppl(G.park))}${grp('self','Tự tập',ppl(G.self))}${grp('none',isT?'Chưa xác nhận · bấm để nhắc':'Chưa xác nhận',pokeList)}${grp('rest','Nghỉ',ppl(G.rest))}`:''}
  </div>
  ${isLeader()&&!past?(()=>{const n=S.assignments.filter(x=>x.date===ds).length,day=isT?'hôm nay':fmtD(ds);
    return`<button class="card link-card lead-card ${n?'':'missing'}" data-act="leadgive" data-v="${ds}"><div class="grow"><span class="lab">Trưởng nhóm · Giao bài</span><b>${n?'Đã giao '+n+' bài · '+day:'Chưa giao bài · '+day}</b></div><span class="chev">›</span></button>`})():''}`;
}

    <div class="cover-bar"><div class="stack">${S.members.map(x=>av(x,'sm')).join('')}</div><span class="grow small muted">${S.members.length} thành viên · Lê Văn Tám</span><label class="btn sm" for="up-cover">${S.media.cover?'Đổi ảnh':'Thêm ảnh nhóm'}</label><input type="file" accept="image/*" id="up-cover" hidden></div></div>`}

    ${ph?`<button class="post-img" data-act="view" data-id="${ph.id}" aria-label="Xem ảnh lớn"><img src="${ph.url}" alt="${esc(ph.cap||'Ảnh của '+w.name)}"></button>${ph.cap?`<p>${esc(ph.cap)}</p>`:''}`:''}

    ${open?`${p.cm.map(c=>`<div class="cm"><b>${esc(M(c.who).name)}</b> ${esc(c.t)}</div>`).join('')}
    <form class="inline-form" data-form="comment" data-id="${p.id}"><input type="text" id="cm-${p.id}" placeholder="Viết bình luận…" aria-label="Bình luận"><button class="btn sm">Gửi</button></form>`:''}
  </article>`}).join('')}`;

function sessPhotos(x){const ph=S.media.album.filter(a=>a.sid===x.id);

function chalCard(c){
  const st=cStatus(c),n=S.members.length,rk=ranking(c),lead=rk[0],myR=rk.findIndex(r=>r.id===S.me)+1;
  const sum=c.participants.reduce((a,id)=>a+(c.progress[id]||{v:0}).v,0);
  const when=st==='live'?`Còn ${between(TODAY,c.end)} ngày`:st==='soon'?`Bắt đầu ${fmtS(c.start)}`:'Đã kết thúc';
  const info=[c.participants.length+'/'+n+' tham gia'];if(c.type==='commit')info.push('cần ≥ '+Math.round(c.minRate*100)+'% số ngày');
  if(st!=='soon'&&lead)info.push((st==='done'?'vô địch ':'dẫn đầu ')+M(lead.id).name);
  if(st!=='soon'&&myR)info.push('bạn hạng '+myR);
  return`<button class="card ch" data-act="openc" data-id="${c.id}">
    <div class="sec-h"><b class="ch-n">${esc(c.name)}</b><span class="pill ${st==='live'?'good':st==='soon'?'acc':''}">${when}</span></div>
    <p class="small muted">${esc(info.join(' · '))}</p>
    ${c.team&&st==='live'?`<div class="bar"><i style="width:${Math.min(100,sum/c.team*100)}%"></i></div><p class="small muted">Cả nhóm ${fmtN(sum)} / ${fmtN(c.team)} ${unitOf(c)}</p>`:''}
  </button>`;
}
function chalStats(c){
  const st=cStatus(c),n=S.members.length;
  const active=c.participants.filter(id=>(c.progress[id]||{}).last===TODAY).length;
  const sum=c.participants.reduce((a,id)=>a+(c.progress[id]||{v:0}).v,0);
  return`<div class="stats">
    <div class="stat"><span class="num">${Math.round(c.participants.length/n*100)}%</span><small>Tham gia ${c.participants.length}/${n}</small></div>
    <div class="stat"><span class="num">${st==='live'?active+'/'+c.participants.length:'–'}</span><small>Ghi hôm nay</small></div>
    <div class="stat"><span class="num">${st==='live'?between(TODAY,c.end):st==='soon'?between(TODAY,c.start):0}</span><small>${st==='soon'?'Ngày tới lúc bắt đầu':'Ngày còn lại'}</small></div></div>
  ${c.team?`<div class="row small"><span class="grow muted">Mục tiêu cả nhóm</span><span class="num" style="font-size:1rem">${fmtN(sum)} / ${fmtN(c.team)}</span></div><div class="bar"><i style="width:${Math.min(100,sum/c.team*100)}%"></i></div>`:''}`;
}

  ${done.length?`<details class="fold"><summary>Đã kết thúc (${done.length})</summary><div class="sec">${done.map(chalCard).join('')}</div></details>`:''}`;

      <p class="small muted">Cho loại Cam kết:</p>

      <label class="field"><span>Hình phạt nếu dưới mức</span><input type="text" id="cf-penalty" placeholder="VD: Bao nước cả nhóm sau buổi tập chung"></label>
      <label class="field"><span>Bài tập của challenge</span><select id="cf-lesson">${S.lessons.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Mục tiêu cả nhóm</span><input type="number" id="cf-team" min="0" value="7000"></label>
      <label class="field"><span>Luật và mô tả</span><textarea id="cf-desc" placeholder="Cách tính rep, yêu cầu form…"></textarea></label>
      <label class="field"><span>Phần thưởng</span><input type="text" id="cf-reward" placeholder="VD: Người về chót bao cà phê"></label>
      <div class="field"><span>Người tham gia (mặc định cả nhóm)</span><div class="checks">${S.members.map(m=>`<label><input type="checkbox" id="cf-p-${m.id}" checked>${esc(m.name)}</label>`).join('')}</div></div>
    </div></details>
    ${ui.err?`<p class="err">${esc(ui.err)}</p>`:''}
    <button class="btn pri">Tạo challenge</button>

function vCommit(c){
  const m=me(),st=cStatus(c),joined=c.participants.includes(m.id),p=c.progress[m.id]||{},info=commitInfo(c,m.id);
  const pct=Math.round(c.minRate*100),L=S.lessons.find(l=>l.id===c.lesson),doneToday=(p.days||[]).includes(TODAY);
  const cp=(S.media.cp||{})[c.id]||{};
  const ph=(id,k)=>{const u=cp[id]&&cp[id][k];return u?`<img src="${u}" alt="Ảnh ${k==='before'?'trước':'sau'} của ${esc(M(id).name)}">`:(c.progress[id]||{})[k]==='sample'?'<span class="ph-sample">Ảnh mẫu</span>':''};
  const afterFrom=iso(parse(c.end).getTime()-2*DAY),afterOpen=TODAY>=afterFrom;
  const head=`<button class="btn ghost" data-act="backc" style="align-self:flex-start">← Tất cả challenge</button>
  <div class="sec"><span class="pill ${st==='live'?'good':''}" style="align-self:flex-start">${CTYPE[c.type]} · cần ≥ ${pct}% số ngày</span><h2 style="text-transform:none;font-size:1.9rem">${esc(c.name)}</h2>
  <p class="muted small">${fmtD(c.start)} → ${fmtD(c.end)} · ${info.total} ngày · tạo bởi ${esc(M(c.by).name)}</p></div>`;
  const rules=`<div class="card">
    ${c.desc?`<p>${esc(c.desc)}</p>`:''}
    <div class="rules">
      <div><span class="lab">Yêu cầu</span><p>Tập ít nhất <b>${pct}% số ngày</b> (${info.need}/${info.total} ngày)</p></div>
      <div><span class="lab">Dưới ${pct}%</span><p>${esc(c.penalty||'Chưa đặt hình phạt')}</p></div>
      <div><span class="lab">Ảnh</span><p>Nộp ảnh bụng lúc tham gia và lúc kết thúc</p></div>
      ${c.reward?`<div><span class="lab">Phần thưởng</span><p>${esc(c.reward)}</p></div>`:''}
    </div>
    ${chalStats(c)}
  </div>`;
  const mine=!joined?(st==='done'?'':`<div class="card join-card"><h3>Tham gia challenge</h3>
      <p class="small">Để tham gia, nộp <b>ảnh bụng trước khi bắt đầu</b>. Ảnh chỉ bạn và anh Phi Le xem được, không đăng lên bảng tin.</p>
      <label class="btn pri" for="up-cb-${c.id}">Chụp hoặc chọn ảnh để tham gia</label><input type="file" accept="image/*" id="up-cb-${c.id}" hidden></div>`)
   :`<div class="card"><div class="sec-h"><h3>Tiến độ của bạn</h3><span class="pill ${info.pass?'good':info.possible?'acc':'warn'}">${info.pass?'Đã đạt yêu cầu':info.possible?'Đang thực hiện':'Không thể đạt '+pct+'%'}</span></div>
      <div class="commit-bar"><div class="bar"><i style="width:${info.done/info.total*100}%"></i></div><span class="cb-mark" style="left:${c.minRate*100}%" title="Mốc ${pct}%"></span></div>
      <p class="small"><b>${info.done}/${info.total} ngày</b> · cần ${info.need} ngày · còn ${info.left} ngày · tỉ lệ hiện tại ${Math.round(info.rate*100)}%</p>
      ${!info.possible&&!info.pass?`<div class="note rest-warn">Số ngày còn lại không đủ để đạt ${pct}%. Hình phạt: ${esc(c.penalty)}.</div>`:''}
      ${st==='live'?`<button class="btn pri block" data-act="cday" data-id="${c.id}" ${doneToday?'disabled':''}>${doneToday?'Đã điểm danh hôm nay':'Tập xong bài core hôm nay · Điểm danh'}</button>`:''}
      <div class="ba">
        <div class="ba-i"><span class="lab">Ảnh trước</span><div class="ba-ph">${ph(m.id,'before')||'<span class="ph-sample">Chưa có</span>'}</div></div>
        <div class="ba-i"><span class="lab">Ảnh sau</span><div class="ba-ph">${ph(m.id,'after')||(afterOpen?`<label class="btn sm" for="up-ca-${c.id}">Nộp ảnh sau</label><input type="file" accept="image/*" id="up-ca-${c.id}" hidden>`:`<span class="ph-sample">Mở từ ${fmtD(afterFrom)}</span>`)}</div></div>
      </div>
      <p class="small muted">Ảnh chỉ bạn và anh Phi Le xem được.</p></div>`;
  const prog=`<div class="card"><div class="sec-h"><h3>Bài tập của challenge</h3><span class="small muted">Anh Phi Le soạn</span></div>
    ${L?lessonSections(L.items)+(L.note?`<div class="note">${esc(L.note)}</div>`:''):'<p class="muted small">Chưa chọn bài tập.</p>'}
    ${isLeader()?'<a class="btn ghost sm" href="#lessons" style="align-self:flex-start">Sửa bài trong Thư viện</a>':''}</div>`;

function spark(vals,h){

  <div class="card"><h3>Mời thành viên mới</h3>

      <button class="btn ghost sm" data-act="newinv" style="align-self:flex-start">Tạo mã mới (mã cũ hết hiệu lực)</button>`

  </div>`;

      return`<div class="item asg-item"><div class="grow"><b>${esc(targetLabel(a.target))}</b> <span class="small muted">${a.target.type==='member'?'· bài riêng':'· '+ids.map(id=>M(id).name).join(', ')}</span><p class="small muted">${a.items.map(it=>exI(it.ex).n+' '+dose(it)).join(' · ')}</p>${dr.date===TODAY?skipNotes(a,ids):''}</div>${dr.date===TODAY?`<span class="pill ${done===ids.length&&ids.length?'good':''}">${done}/${ids.length} xong</span>`:''}<button class="btn sm" data-act="dela" data-id="${a.id}" aria-label="Xóa bài">Xóa</button></div>`}).join('')}</div>`:'<p class="muted">Chưa giao bài nào cho ngày này.</p>'}

  </div>
  <form class="card" data-form="assign"><h3>Giao bài mới</h3>

    <div class="field"><span>Bài tập · hiệp (hoặc vòng) · rep hoặc giây</span>
      ${dr.items.map((it,i)=>`<div class="drow"><select id="dr-ex-${i}" aria-label="Bài tập ${i+1}">${exOpts(it.ex)}</select><input type="number" min="1" id="dr-sets-${i}" value="${it.sets}" aria-label="Số hiệp">${exI(it.ex).combo?'<span class="small muted">vòng</span>':`<input type="number" min="1" id="dr-reps-${i}" value="${it.reps}" aria-label="${exI(it.ex).u==='s'?'Số giây':'Số rep'}">`}<button type="button" class="x" data-act="delrow" data-i="${i}" aria-label="Xóa dòng">×</button></div>`).join('')}

/* ---------- render ---------- */
const TABS=[['today','Lịch'],['schedule','Tập chung'],['group','Nhóm'],['me','Tôi']];
I.today=I.schedule;
I.schedule='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-6M8 16h8a4 4 0 0 0 1-7.9A5 5 0 0 0 7.1 7 4.5 4.5 0 0 0 8 16z"/></svg>';
function render(){
  if((ui.tab==='assign'||ui.tab==='lessons')&&!isLeader())ui.tab='today';
  const sel=document.getElementById('me-select');
  sel.innerHTML=S.members.map(m=>`<option value="${m.id}" ${m.id===S.me?'selected':''}>${esc(m.name)}${m.role==='leader'?' (trưởng nhóm)':''}</option>`).join('');
  const tabs=TABS.concat(isLeader()?[['assign','Giao bài']]:[]);
  const todo=isLeader()?unassignedDays():0;
  document.getElementById('nav').innerHTML=tabs.map(([k,l])=>{const dot=k==='assign'&&todo;
    return`<a href="#${k}" ${ui.tab===k?'aria-current="page"':''} ${dot?`aria-label="${l}, còn ${todo} ngày chưa giao bài"`:''}>${I[k]}${dot?'<i class="nav-dot" aria-hidden="true"></i>':''}<span>${l}</span></a>`}).join('');
  const v={today:vToday,group:vGroup,schedule:vSchedule,me:vProfile,assign:vAssign,lessons:vLessons}[ui.tab];
  document.getElementById('view').innerHTML=v();
  const lb=document.getElementById('lb');let lbHtml='';
  if(ui.view){const isCover=ui.view==='cover',ph=isCover?null:S.media.album.find(x=>x.id===ui.view),src=isCover?S.media.cover:ph&&ph.url;
    if(src){const w=ph&&M(ph.who);lbHtml=`<div class="lightbox" data-act="closeview" role="dialog" aria-label="Xem ảnh"><img src="${src}" alt="${esc(ph&&ph.cap||'Ảnh nhóm')}">
      <p class="small">${isCover?'Ảnh nhóm':esc(w.name)+' · '+ago(ph.ts)+(ph.cap?' · '+esc(ph.cap):'')}</p>
      <div class="row">${isCover?'<button class="btn sm" data-act="delcover">Gỡ ảnh nhóm</button>':ph.who===S.me?`<button class="btn sm" data-act="delph" data-id="${ph.id}">Xóa ảnh</button>`:''}<button class="btn sm" data-act="closeview">Đóng</button></div></div>`}else ui.view=null}
  lb.innerHTML=lbHtml;
  save();
}
function go(){let h=location.hash.slice(1);if(h==='feed'||h==='challenge'||h==='album'){ui.sub=h;h='group'}if(h==='profile')h='me';ui.tab=['today','group','schedule','me','assign','lessons'].includes(h)?h:'today';ui.chal=null;ui.err='';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',go);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.view){ui.view=null;render()}});

/* ---------- actions ---------- */
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function rankOf(c,id){return ranking(c).findIndex(r=>r.id===id)+1}
function allDoneCheck(){
  if(S.groupDone===TODAY)return;
  if(S.members.every(x=>statusOf(x))){S.groupDone=TODAY;S.groupStreak++;post(S.me,'group','hoàn thành bài cuối cùng. Cả nhóm xong hết hôm nay, chuỗi nhóm lên <b>'+S.groupStreak+' ngày</b>');toast('Cả nhóm hoàn thành! Chuỗi nhóm '+S.groupStreak+' ngày')}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,m=me();
  if(a==='check')return; // handled by change
  e.preventDefault();
  switch(a){
  case 'complete':{const d=day(m.id);d.status='done';ui.volTrain=false;{const a0=assignmentFor(m.id);if(a0)d.log={items:a0.items.map(x=>({...x}))}}
    if(!isDaily(m)){allDoneCheck();const[w1,w2]=weekCount(m);setTimeout(()=>celebrate('Xong buổi hôm nay!','Tuần này '+w1+'/'+w2+' buổi',{kind:'done'}),30);break}
    m.streak++;
    if(m.goal&&m.streak===m.goal)post(m.id,'streak','hoàn thành mục tiêu chuỗi <b>'+m.goal+' ngày</b>');
    else if([7,14,21,30,50,100].includes(m.streak))post(m.id,'streak','đạt chuỗi <b>'+m.streak+' ngày</b> tập liên tục');
    setTimeout(()=>celebrate('Xong buổi hôm nay!','Chuỗi '+m.streak+' ngày liên tục',{kind:'done'}),30);
    allDoneCheck();break}
  case 'rest':{const dd=day(m.id);if(isDaily(m)&&dd.prevStreak==null){dd.prevStreak=m.streak;m.streak=0}dd.status='rest';dd.mode='rest';toast(isDaily(m)?'Đã báo nghỉ, chuỗi về 0':'Đã báo nghỉ hôm nay');allDoneCheck();break}
  case 'voltrain':ui.volTrain=true;break;
  case 'volfree':{day(m.id).status='done';toast('Đã ghi nhận buổi tập thêm hôm nay');allDoneCheck();break}
  case 'poke':{S.pokes[TODAY]=S.pokes[TODAY]||{};S.pokes[TODAY][m.id+'>'+id]=1;toast('Đã nhắc '+M(id).name+' tập bài hôm nay');break}
  case 'react':{const p=S.feed.find(x=>x.id===id),r=t.dataset.r;p.re[r]=p.re[r]||[];const i=p.re[r].indexOf(m.id);i<0?p.re[r].push(m.id):p.re[r].splice(i,1);break}
  case 'openc':ui.chal=id;ui.lb=null;window.scrollTo(0,0);break;
  case 'backc':ui.chal=null;break;
  case 'newc':ui.newChal=!ui.newChal;ui.err='';break;
  case 'lb':ui.lb=t.dataset.v;break;
  case 'joinc':{const c=S.challenges.find(x=>x.id===id);const i=c.participants.indexOf(m.id);
    if(i<0){c.participants.push(m.id);c.progress[m.id]=c.progress[m.id]||{b:0,v:0,last:null};toast('Đã tham gia '+c.name)}else{c.participants.splice(i,1);toast('Đã rời challenge')}break}
  case 'logc':{const c=S.challenges.find(x=>x.id===id);const before=rankOf(c,m.id);const p=c.progress[m.id];p.v++;p.last=TODAY;afterLog(c,before);break}
  case 'rsvp':{const s=S.sessions.find(x=>x.id===id);s.rsvp[m.id]=t.dataset.v;{const dd=dayOf(m.id,s.date);if(t.dataset.v==='yes')dd.mode='park';else if(dd.mode==='park')dd.mode=null}toast(t.dataset.v==='yes'?'Đã báo sẽ đến':'Đã báo không đến');break}
  case 'checkin':{const s=S.sessions.find(x=>x.id===id);if(!s.checkins.includes(m.id)){s.checkins.push(m.id);s.rsvp[m.id]='yes';m.attended=Math.min(8,m.attended+1);
    const f=S.feed.find(p=>p.kind==='meet'&&p.sid===s.id);
    if(f){f.who=m.id;f.text='và '+(s.checkins.length-1)+' người khác đã check-in buổi <b>'+esc(s.title)+'</b>';f.ts=Date.now()}
    else{post(m.id,'meet','đã check-in buổi <b>'+esc(s.title)+'</b>');S.feed[0].sid=s.id}
    toast('Check-in thành công, +1 buổi tập chung')}break}
  case 'skillup':{const sk=m.skills[id],def=SKILLS[id];if(sk.s<def.st.length-1){sk.s++;sk.best='';sk.d=TODAY;post(m.id,'skill','mở khóa <b>'+esc(def.n+' '+def.st[sk.s])+'</b>');toast('Mở khóa '+def.st[sk.s]+'! Đã đăng lên bảng tin')}break}
  case 'view':ui.view=id;break;
  case 'closeview':ui.view=null;break;
  case 'cancelph':ui.pending=null;break;
  case 'delph':{S.media.album=S.media.album.filter(x=>x.id!==id);S.feed=S.feed.filter(p=>p.img!==id);ui.view=null;toast('Đã xóa ảnh');break}
  case 'delcover':S.media.cover=null;ui.view=null;toast('Đã gỡ ảnh nhóm');break;
  case 'streakopen':ui.streakOpen=!ui.streakOpen;ui.calOff=0;break;
  case 'calprev':ui.calOff=Math.max(-11,ui.calOff-1);break;
  case 'calnext':ui.calOff=Math.min(0,ui.calOff+1);break;
  case 'goal':m.goal=+t.dataset.v;toast(m.goal<=m.streak?'Mốc '+m.goal+' ngày bạn đã vượt rồi, thử mốc cao hơn nhé':'Mục tiêu mới: '+m.goal+' ngày, còn '+(m.goal-m.streak)+' ngày');break;
  case 'pmode':{const p=planRef(t.dataset.scope,id);if(t.dataset.scope==='member')delete p.next;
    if(t.dataset.v==='every'){if(p.days.length<7)p.custom=p.days.slice();p.days=[0,1,2,3,4,5,6]}
    else if(p.days.length===7)p.days=p.custom&&p.custom.length&&p.custom.length<7?p.custom.slice():[1,3,5];
    toast((t.dataset.scope==='level'?'Nhóm '+LEVELS[id]:M(id).name)+': '+planLabel(p));break}
  case 'pday':{const p=planRef(t.dataset.scope,id),dd=+t.dataset.d,i=p.days.indexOf(dd);if(t.dataset.scope==='member')delete p.next;
    if(i>=0){if(p.days.length===1){toast('Cần ít nhất 1 ngày tập trong tuần');break}p.days.splice(i,1)}else p.days.push(dd);
    p.days.sort();break}

  else if(kind==='logc'){const c=S.challenges.find(x=>x.id===f.dataset.id);const n=+val('lg-'+c.id);if(!(n>0))return;
    const before=rankOf(c,m.id);const p=c.progress[m.id];
    if(c.type==='total')p.v+=n;else{if(!p.b)p.b=n;p.v=n}
    p.last=TODAY;afterLog(c,before)}
  else if(kind==='session'){const title=val('sf-title'),date=val('sf-date'),time=val('sf-time');
    if(!title)ui.err='Đặt tên cho buổi tập.';else if(!date||date<TODAY)ui.err='Chọn một ngày từ hôm nay trở đi.';
    else{S.sessions.push({id:'s'+Date.now(),title,date,time:time||'05:30',place:val('sf-place')||'Công viên Lê Văn Tám',plan:val('sf-plan'),repeat:'Buổi thêm',rsvp:{[m.id]:'yes'},checkins:[]});ui.newSess=false;toast('Đã lên lịch và báo cả nhóm')}}
  else if(kind==='metric'){const key=val('mf-key'),v=parseFloat(val('mf-val'));
    if(!(v>0))ui.err='Nhập một số lớn hơn 0.';
    else{ui.metricForm=false;const[g,k]=key.split(':');const s=g==='t'?m.tests[k]:m.body[k];const prev=Math.max(...s.map(x=>x.v));
      const ex=s.find(x=>x.d===TODAY);ex?ex.v=v:s.push({d:TODAY,v});
      if(g==='t'&&v>prev){const u=k==='plank'||k==='hang'?'s':' rep';post(m.id,'pr','phá kỷ lục '+TESTS[k].replace(/ \(giây\)/,'')+': <b>'+v+u+'</b> (cũ '+prev+u+')');toast('Kỷ lục mới! Đã đăng lên bảng tin')}
      else toast('Đã lưu chỉ số')}}
  else if(kind==='assign'){const dr=ui.draft,[type,tid]=dr.target.split(':');
    const ds=dr.dates.filter(d=>coveredBy({target:{type,id:tid},date:d}).length).sort();
    if(!dr.items.length)ui.err='Thêm ít nhất một bài tập.';
    else if(!ds.length)ui.err='Chọn ít nhất 1 ngày có người tập.';
    else{ds.forEach((d,k)=>{S.assignments=S.assignments.filter(a=>!(a.date===d&&a.target.type===type&&a.target.id===tid));
        S.assignments.push({id:'a'+Date.now()+'-'+k,date:d,target:{type,id:tid},items:dr.items.map(x=>({...x})),note:dr.note});
        if(d===TODAY)coveredBy(last(S.assignments)).forEach(id=>{const dd=day(id);if(!dd.status){dd.checked=[];dd.skips={}}})});
      toast('Đã giao bài cho '+targetLabel({type,id:tid})+(ds.length>1?' trong '+ds.length+' ngày ('+fmtS(ds[0])+' → '+fmtS(last(ds))+')':' ngày '+fmtS(ds[0])))}}
  render();
});

go();
})();
</script>
